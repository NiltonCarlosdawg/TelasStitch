<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background h-full font-body-md text-on-background m-0 p-0 overflow-hidden relative">
<!-- Top App Bar (Suppressed on this screen as it's a focused tracking view, but adding a simplified close/help header) -->
<header class="absolute top-0 left-0 w-full z-50 p-margin flex justify-between items-center pointer-events-none">
<button class="w-10 h-10 rounded-full bg-surface-container/90 backdrop-blur-md shadow-sm flex items-center justify-center text-on-surface pointer-events-auto">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<button class="h-10 px-4 rounded-full bg-surface-container/90 backdrop-blur-md shadow-sm flex items-center justify-center gap-2 text-primary pointer-events-auto">
<span class="material-symbols-outlined text-[20px]" data-icon="help">help</span>
<span class="font-label-lg">Ajuda</span>
</button>
</header>
<!-- Map Background Area -->
<div class="absolute inset-0 z-0 h-[60%]">
<img alt="Map view showing the delivery route." class="w-full h-full object-cover opacity-80" data-alt="A stylized, modern digital map view depicting a delivery route in a bustling city. The map uses a dark mode aesthetic with deep blacks and grays, punctuated by a bright orange delivery path line. A small 3D icon of a scooter represents the driver on the route. The lighting suggests nighttime with a focused, modern mood, fitting for a dark mode food delivery application." data-location="Luanda" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcfDTKg3eJRZEy0SFCptOZZT72Bw4I_AG8j_ziiztUE6aLM26iz_3Z5UenIldhRggOQpJxBJEWe3TyI27h9r9Vp0gsyVp6Izxj_dn4uuerfIWfOFZ3ZqUGMI6vHVoYvDrdXRvdg18ExpFx1QK0acSGV-RjY2JXUWdKft3pzx6msOPm0Miuda_pyVT5mBrxsyiy3qjJNwCeoYmB1djjbzTOmLllnH7VKw2QQggD4nXiEKuLxUELH99InQQ9o4PdWG-Cxakgzmdv1y8"/>
<!-- Fake Map Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-background"></div>
<!-- Driver Marker (Fake) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-12 h-12 bg-surface-container-high rounded-full shadow-lg flex items-center justify-center relative z-10 border-2 border-primary">
<span class="material-symbols-outlined text-primary" data-icon="two_wheeler">two_wheeler</span>
</div>
<div class="w-4 h-4 bg-primary rounded-full blur-[4px] mt-1 opacity-50 relative -top-3"></div>
</div>
</div>
<!-- Bottom Sheet (Tracking Details) -->
<div class="absolute bottom-0 left-0 w-full z-10 bg-surface rounded-t-[32px] shadow-[0_-8px_30px_rgba(0,0,0,0.5)] flex flex-col h-[55%] max-h-[600px] transition-transform duration-300">
<!-- Handle -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="flex-1 overflow-y-auto px-margin pb-[48px]">
<!-- Delivery Status Header -->
<div class="text-center mb-lg">
<h2 class="font-headline-md text-on-surface mb-1">Chegando em 15 min</h2>
<p class="font-body-md text-on-surface-variant">Previsão: 20:15 - 20:25</p>
</div>
<!-- Restaurant Info Card -->
<div class="bg-surface-container rounded-xl p-md shadow-sm flex items-center gap-md mb-xl border border-surface-container-highest">
<div class="w-14 h-14 rounded-lg bg-surface-container-highest overflow-hidden flex-shrink-0">
<img alt="Burger place logo" class="w-full h-full object-cover" data-alt="A stylized, appetizing close-up of a premium gourmet burger with melting cheese, crisp lettuce, and a shiny brioche bun. The lighting is warm and inviting, highlighting the textures of the food. The image is cropped tightly to serve as a high-quality restaurant avatar or logo representation in a modern food delivery app, utilizing bright, warm tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAywhr7mZqGe7xGpRZFxImjXX8Wdtmw8pVP-BsP_md1yKo5dFYWIVui_a78ZyY9fmg_PkcIRA8Jk115UeFh4CXVYOSr5BWifUdfWP9i1sSsqoYyRt2mBOqvuo5e3_nsi34adF1HBJFr8aE2jDWafGQHVEVIXNEK2Ffpxu6f8VHJGoWNMZDaATbcbXaAD2yUS-qwHWg5sAP4oIzyBwJTQ_7KA9_KLL7kBkTa9lit_tY9cr5EfgFsaL4HAISaI82tDvffw6XD8Xy-x9U"/>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-body-lg font-bold text-on-surface truncate">Tio Sam Burger</h3>
<p class="font-body-md text-on-surface-variant truncate">Pedido #4092</p>
</div>
<button class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="call">call</span>
</button>
</div>
<!-- Timeline -->
<div class="relative pl-sm">
<!-- Vertical Line -->
<div class="absolute left-[19px] top-6 bottom-6 w-[2px] bg-surface-variant z-0"></div>
<!-- Step 1: Confirmado (Completed) -->
<div class="flex gap-md mb-lg relative z-10">
<div class="w-6 h-6 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
<div>
<h4 class="font-body-lg text-on-surface">Pedido Confirmado</h4>
<p class="font-body-md text-on-surface-variant">19:45</p>
</div>
</div>
<!-- Step 2: Em preparo (Completed) -->
<div class="flex gap-md mb-lg relative z-10">
<div class="w-6 h-6 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
<div>
<h4 class="font-body-lg text-on-surface">Em preparo</h4>
<p class="font-body-md text-on-surface-variant">19:50</p>
</div>
</div>
<!-- Step 3: Em entrega (Active) -->
<div class="flex gap-md mb-lg relative z-10">
<!-- Active line overlay to this point -->
<div class="absolute left-[11px] top-[-30px] bottom-6 w-[2px] bg-primary z-[-1]"></div>
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center flex-shrink-0 mt-1 shadow-[0_0_0_4px_rgba(255,181,155,0.2)]">
<span class="material-symbols-outlined text-[14px]" data-icon="two_wheeler">two_wheeler</span>
</div>
<div>
<h4 class="font-body-lg font-bold text-on-surface">Em entrega</h4>
<p class="font-body-md text-primary">João está a caminho</p>
</div>
</div>
<!-- Step 4: Entregue (Pending) -->
<div class="flex gap-md relative z-10 opacity-50">
<div class="w-6 h-6 rounded-full bg-surface-variant border-2 border-surface flex items-center justify-center flex-shrink-0 mt-1">
<div class="w-2 h-2 rounded-full bg-surface"></div>
</div>
<div>
<h4 class="font-body-lg text-on-surface-variant">Entregue</h4>
</div>
</div>
</div>
</div>
</div>
