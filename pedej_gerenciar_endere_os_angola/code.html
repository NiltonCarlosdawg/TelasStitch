<body class="font-body-md text-on-background min-h-screen flex flex-col pb-[80px]">
<!-- TopAppBar -->
<header class="bg-white dark:bg-zinc-900 docked full-width top-0 z-50 shadow-sm sticky">
<div class="flex items-center justify-between px-4 h-16 w-full max-w-screen-xl mx-auto border-b border-zinc-100 dark:border-zinc-800">
<button class="text-zinc-900 dark:text-zinc-100 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors p-2 rounded-full flex items-center justify-center active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-orange-600 dark:text-orange-500 font-inter text-lg font-bold text-center flex-1">Delivery Address</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</div>
</header>
<main class="flex-1 flex flex-col max-w-screen-md mx-auto w-full relative">
<!-- Map View Area -->
<section class="relative w-full h-[300px] bg-surface-container-low shrink-0 overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A highly detailed overhead map view showing the urban layout of Luanda, Angola. The map displays streets, city blocks, and subtle topographical features in a modern, clean cartographic style suitable for a modern delivery app interface. The color palette is light and bright, featuring soft whites, very light greys, and subtle warm tones that align with a high-energy brand identity. The lighting implies a clear daytime view. The aesthetic is crisp, professional, and optimized for an appetizing, high-contrast user interface context." style="background-image: url('https://lh3.googleusercontent.com/aida/ADBb0uir44oUCeT7elOFei4rt65Z1HGaOuioG6ZGsWXWtbBpt7OU53aHBO81zBTVFTzNoWz3hNckMWu4ZO_dwt7a4pes0RHVD3JgGBAolpcHqczejtGi6aJ3nlnrQwWWygBmeEtUweEoRuS2-eUCkzJ2lCMTgcEQxicOeGgv4CSWvT_HpixMM8a3QF5LKpZPEyiYa9nNIMAWeLBgecZZxe7YPF35rp-YgdSV6LLHkzQvASZ_brYBAjALSREKg1vpuslmqeUFMk_T2ZmqHQ');"></div>
<div class="absolute inset-0 bg-gradient-to-b from-black/10 to-transparent"></div>
<!-- Center Pin -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-primary-container text-white p-2 rounded-full shadow-lg flex items-center justify-center animate-bounce">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="w-2 h-1 bg-black/20 rounded-[100%] mt-1 shadow-sm"></div>
</div>
<!-- GPS Button -->
<button class="absolute bottom-4 right-4 bg-white text-on-surface p-3 rounded-full shadow-md hover:bg-surface-container-low transition-colors flex items-center justify-center z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</section>
<!-- Content Area -->
<div class="flex-1 bg-white -mt-4 rounded-t-xl relative z-20 px-container-margin pt-space-lg pb-32 flex flex-col gap-space-lg shadow-[0_-4px_12px_rgba(41,41,41,0.04)]">
<!-- Search Bar -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-tertiary">search</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-surface-dim rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-tertiary" placeholder="Procurar novo endereço em Luanda..." type="text"/>
</div>
<!-- Saved Addresses -->
<section class="flex flex-col gap-space-md">
<h2 class="text-headline-md font-headline-md text-on-surface">Meus Endereços</h2>
<div class="flex flex-col gap-space-sm">
<!-- Address Card: Casa -->
<button class="flex items-center gap-space-md p-space-md bg-surface-bright rounded-lg border border-surface-container shadow-sm hover:border-primary/30 transition-colors text-left w-full focus:ring-2 focus:ring-primary focus:outline-none">
<div class="bg-surface-container-low p-2 rounded-full flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-label-lg font-label-lg text-on-surface truncate">Casa</p>
<p class="text-body-md font-body-md text-on-surface-variant truncate text-sm mt-0.5">Rua da Missão, Apt 42 - Mutamba</p>
</div>
<span class="material-symbols-outlined text-tertiary shrink-0">more_vert</span>
</button>
<!-- Address Card: Trabalho -->
<button class="flex items-center gap-space-md p-space-md bg-surface-bright rounded-lg border border-surface-container shadow-sm hover:border-primary/30 transition-colors text-left w-full focus:ring-2 focus:ring-primary focus:outline-none">
<div class="bg-surface-container-low p-2 rounded-full flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-label-lg font-label-lg text-on-surface truncate">Trabalho</p>
<p class="text-body-md font-body-md text-on-surface-variant truncate text-sm mt-0.5">Torre Ambiente, 5º Andar - Talatona</p>
</div>
<span class="material-symbols-outlined text-tertiary shrink-0">more_vert</span>
</button>
<!-- Address Card: Outros -->
<button class="flex items-center gap-space-md p-space-md bg-surface-bright rounded-lg border border-surface-container shadow-sm hover:border-primary/30 transition-colors text-left w-full focus:ring-2 focus:ring-primary focus:outline-none">
<div class="bg-surface-container-low p-2 rounded-full flex items-center justify-center text-tertiary shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-label-lg font-label-lg text-on-surface truncate">Ginásio</p>
<p class="text-body-md font-body-md text-on-surface-variant truncate text-sm mt-0.5">Avenida Comandante Gika - Maianga</p>
</div>
<span class="material-symbols-outlined text-tertiary shrink-0">more_vert</span>
</button>
</div>
</section>
</div>
<!-- Sticky CTA Bottom -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t border-surface-container-highest p-4 z-40 pb-safe pb-8 shadow-[0_-8px_20px_rgba(41,41,41,0.05)] md:pb-4 max-w-screen-md md:left-1/2 md:-translate-x-1/2">
<button class="w-full bg-primary-container text-on-primary font-button text-button py-4 rounded-full shadow-md hover:bg-primary transition-colors flex items-center justify-center focus:ring-4 focus:ring-primary/20 focus:outline-none active:scale-95 duration-150">
